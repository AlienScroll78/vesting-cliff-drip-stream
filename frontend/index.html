<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vesting Stream</title>
  <meta name="description" content="Cliff + drip vesting on Stellar" />
  <!-- #539 — PWA manifest & theme -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#3182ce" />
  <link rel="stylesheet" href="print.css" media="print" />
  <!-- no-FOUC: apply theme class + data-theme before first paint -->
  <script>
    (function(){try{var s=localStorage.getItem('vesting-dark-mode');var d=s==='true'||(s===null&&window.matchMedia('(prefers-color-scheme: dark)').matches);var e=document.documentElement;if(d){e.classList.add('dark')}else{e.classList.remove('dark')}e.setAttribute('data-theme',d?'dark':'light')}catch(e){}})();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
