<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vesting Stream</title>
  <meta name="description" content="Cliff + drip vesting on Stellar" />
  <!-- #539 — PWA manifest & theme -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1d6ae5" />
  <!-- no-FOUC: apply dark class before first paint -->
  <script>
    (function(){try{var d=localStorage.getItem('vesting-dark-mode');if(d==='true'||(d===null&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}}catch(e){}})();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
