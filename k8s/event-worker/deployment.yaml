apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-worker
  namespace: vesting-production
  labels:
    app.kubernetes.io/name: event-worker
    app.kubernetes.io/part-of: vesting-cliff-drip-stream
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-worker
      app.kubernetes.io/part-of: vesting-cliff-drip-stream
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-worker
        app.kubernetes.io/part-of: vesting-cliff-drip-stream
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # This pod runs two background workers in a single container:
      #   1. horizonWorker  — polls Horizon for on-chain contract events and
      #                       writes them to stream_events (always active).
      #   2. jobWorker      — dequeues and processes async jobs from the Redis
      #                       job_queue list (activated via ENABLE_JOB_WORKER).
      #
      # To enable the jobWorker set ENABLE_JOB_WORKER=true in the environment
      # (either via the ConfigMap or the Secrets manifest).
      containers:
        - name: event-worker
          image: ghcr.io/your-org/vesting-cliff-drip-stream/event-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          env:
            # Set to "true" to activate the async jobWorker loop alongside
            # the horizonWorker.  See backend/src/workers/jobWorker.ts.
            - name: ENABLE_JOB_WORKER
              value: "true"
          envFrom:
            - configMapRef:
                name: vesting-config
            - secretRef:
                name: vesting-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
