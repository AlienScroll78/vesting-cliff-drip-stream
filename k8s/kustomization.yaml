apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vesting-production

commonLabels:
  app.kubernetes.io/part-of: vesting-cliff-drip-stream

resources:
  # Shared config & secrets
  - configmap.yaml
  - external-secrets.yaml

  # Backend API
  - backend-api/deployment.yaml
  - backend-api/service.yaml

  # Event Worker
  - event-worker/deployment.yaml

  # Frontend
  - frontend/deployment.yaml
  - frontend/service.yaml

  # Autoscaling & availability
  - hpa.yaml
  - pdb.yaml

  # Network policies
  - network-policies/
