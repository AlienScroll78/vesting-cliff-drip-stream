apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vesting-secrets
  namespace: vesting-production
  labels:
    app.kubernetes.io/name: vesting-secrets
    app.kubernetes.io/part-of: vesting-cliff-drip-stream
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vesting-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: vesting/production
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: vesting/production
        property: REDIS_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: vesting/production
        property: JWT_SECRET
    - secretKey: STELLAR_SECRET_KEY
      remoteRef:
        key: vesting/production
        property: STELLAR_SECRET_KEY
