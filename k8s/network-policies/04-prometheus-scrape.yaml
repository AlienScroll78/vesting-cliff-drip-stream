# NetworkPolicy: Prometheus → all services (metrics scrape)
#
# Allows Prometheus to scrape metrics from every pod in the vesting namespace.
#
# Scrape ports:
#   - 9090  — dedicated metrics port (standalone exporters, Prometheus itself)
#   - 3000  — backend API port; the vesting-backend service exposes GET /metrics
#             at http://<pod>:3000/metrics (not on a separate port).
#             NOTE: The /metrics endpoint on port 3000 is unauthenticated so
#             Prometheus can reach it without bearer tokens.
#
# Two complementary policies:
#   1. Egress from Prometheus pods to any pod on ports 9090 and 3000
#   2. Ingress to any service pod from Prometheus on ports 9090 and 3000
#
# Label assumptions:
#   Prometheus pods: app.kubernetes.io/name=prometheus
#                    (kube-prometheus-stack uses this label by default)
#
# Namespace note: Prometheus commonly runs in a dedicated namespace (e.g.
# "monitoring").  If so, replace the podSelector-only from/to rules with a
# combined namespaceSelector + podSelector pattern.  See the inline comments.
---
# Egress from Prometheus → all pods in vesting namespace on ports 9090 and 3000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-egress
  namespace: vesting
  labels:
    app.kubernetes.io/managed-by: kustomize
    policy-type: allow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    # Scrape any pod in the same namespace on port 9090 (dedicated metrics port)
    - to:
        - podSelector: {}   # matches all pods in the vesting namespace
      ports:
        - protocol: TCP
          port: 9090
    # Scrape the backend API on port 3000 (GET /metrics — unauthenticated)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Ingress to all service pods ← Prometheus on ports 9090 and 3000
# This policy is applied to every pod (podSelector: {}) so any workload that
# binds :9090 or :3000 will accept scrape connections from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-ingress
  namespace: vesting
  labels:
    app.kubernetes.io/managed-by: kustomize
    policy-type: allow
spec:
  podSelector: {}   # all pods in the vesting namespace
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
          # Uncomment the block below if Prometheus runs in a separate namespace
          # (e.g. "monitoring").  The namespaceSelector and podSelector are AND-ed.
          # namespaceSelector:
          #   matchLabels:
          #     kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        # Backend API metrics endpoint (GET /metrics) is served on port 3000
        - protocol: TCP
          port: 3000
