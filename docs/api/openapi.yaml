openapi: 3.1.0
info:
  title: Vesting Cliff Drip Stream API
  version: 2.0.0
  description: >
    Backend API for the Vesting Cliff Drip Stream smart contract indexer.
    Provides indexed stream data, analytics, transaction building, and health
    probes. All mutating endpoints require JWT Bearer authentication.
  contact:
    name: Vesting Cliff Drip Stream
    url: https://github.com/CodeKhali/vesting-cliff-drip-stream
  license:
    name: MIT

servers:
  - url: https://api.dripswave.app
    description: Production
  - url: https://staging-api.dripswave.app
    description: Staging
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Streams
    description: Vesting stream queries and management
  - name: Analytics
    description: Aggregate statistics and summaries
  - name: Health
    description: Liveness and readiness probes

# ─────────────────────────────────────────────────────────────────────────────
# Security schemes
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by POST /api/v1/auth/challenge + POST /api/v1/auth/verify.
        Include as `Authorization: Bearer <token>` header.

  # ─────────────────────────────────────────────────────────────────────────
  # Reusable schemas
  # ─────────────────────────────────────────────────────────────────────────
  schemas:
    # ── Primitives ────────────────────────────────────────────────────────────
    StellarAddress:
      type: string
      pattern: "^G[A-Z2-7]{55}$"
      minLength: 56
      maxLength: 56
      description: >
        Stellar public key (G-address). Starts with G followed by 55
        uppercase base-32 characters (A–Z, 2–7).
      examples:
        - GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN

    ContractAddress:
      type: string
      pattern: "^C[A-Z2-7]{55}$"
      minLength: 56
      maxLength: 56
      description: >
        Soroban contract address (C-address). Starts with C followed by 55
        uppercase base-32 characters.
      examples:
        - CCJZ5DPSLXROYIQ373NBNANGKKBKM4DZJMKBMJDUZM4DZJMKBMJDUZM4

    StreamStatus:
      type: string
      enum: [active, pre_cliff, expired, cancelled, drained]
      description: >
        Lifecycle state of a vesting stream.
        - `active` — stream is live and tokens are accruing.
        - `pre_cliff` — stream started but cliff has not been reached.
        - `expired` — end_ledger passed; no more tokens accrue.
        - `cancelled` — sponsor cancelled the stream.
        - `drained` — expired stream was permissionlessly drained.

    # ── Core entities ─────────────────────────────────────────────────────────
    Stream:
      type: object
      required:
        - recipient
        - sponsor
        - token
        - rate_per_ledger
        - start_ledger
        - cliff_ledger
        - end_ledger
        - status
        - created_at
      properties:
        recipient:
          $ref: "#/components/schemas/StellarAddress"
        sponsor:
          $ref: "#/components/schemas/StellarAddress"
        token:
          $ref: "#/components/schemas/ContractAddress"
        rate_per_ledger:
          type: string
          description: Tokens released per ledger as a string-encoded integer.
          examples:
            - "1000"
        start_ledger:
          type: integer
          format: int64
          description: Ledger sequence when the stream started.
          examples:
            - 52000000
        cliff_ledger:
          type: integer
          format: int64
          description: Ledger sequence at which the cliff is reached.
          examples:
            - 52017280
        end_ledger:
          type: integer
          format: int64
          description: Ledger sequence when the stream ends.
          examples:
            - 52172800
        status:
          $ref: "#/components/schemas/StreamStatus"
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp when the stream was cancelled, or null.
          examples:
            - null
        claimable_amount:
          type: string
          description: Current claimable token amount as a string-encoded integer.
          examples:
            - "5000000"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the stream was indexed.
          examples:
            - "2026-01-15T10:30:00Z"

    StreamStatus_Endpoint:
      type: object
      required:
        - recipient
        - status
        - updated_at
      properties:
        recipient:
          $ref: "#/components/schemas/StellarAddress"
        status:
          $ref: "#/components/schemas/StreamStatus"
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the last status transition.
          examples:
            - "2026-01-15T10:30:00Z"

    Event:
      type: object
      required:
        - id
        - event_type
        - ledger_sequence
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique event identifier.
        event_type:
          type: string
          enum:
            - stream_created
            - tokens_claimed
            - stream_cancelled
            - stream_drained
            - stream_clawed_back
          description: Type of contract event.
        ledger_sequence:
          type: integer
          format: int64
          description: Ledger sequence number where the event was emitted.
          examples:
            - 52017280
        transaction_hash:
          type: string
          description: Hash of the Stellar transaction that emitted the event.
          nullable: true
        amount:
          type: string
          nullable: true
          description: Token amount involved in the event (for claim/drain events).
          examples:
            - "5000000"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the event was indexed.

    ClaimTransactionEnvelope:
      type: object
      required:
        - transaction_xdr
        - network_passphrase
      properties:
        transaction_xdr:
          type: string
          description: >
            Base64-encoded XDR of the unsigned transaction envelope.
            Sign this with the recipient's key and submit to Horizon.
        network_passphrase:
          type: string
          description: Stellar network passphrase for transaction signing.
          examples:
            - "Test SDF Network ; September 2015"
        fee_stroops:
          type: string
          description: Estimated fee in stroops.
          examples:
            - "100"
        expires_at:
          type: string
          format: date-time
          description: >
            Time at which the built transaction's sequence number expires.
            Rebuild if this deadline is exceeded.

    AnalyticsSummary:
      type: object
      required:
        - total_streams
        - active_streams
        - total_value_locked
        - total_claimed
      properties:
        total_streams:
          type: integer
          description: Total number of streams ever indexed.
          examples:
            - 1247
        active_streams:
          type: integer
          description: Number of streams currently in active or pre_cliff state.
          examples:
            - 892
        total_value_locked:
          type: string
          description: >
            Sum of remaining tokens across all active streams (string integer).
          examples:
            - "9876543210000"
        total_claimed:
          type: string
          description: Sum of all claimed tokens across all streams (string integer).
          examples:
            - "1234567890000"
        unique_sponsors:
          type: integer
          description: Count of distinct sponsor addresses.
          examples:
            - 143
        unique_recipients:
          type: integer
          description: Count of distinct recipient addresses.
          examples:
            - 892
        by_status:
          type: object
          description: Stream count keyed by status.
          additionalProperties:
            type: integer
          examples:
            - active: 600
              pre_cliff: 292
              expired: 210
              cancelled: 145
              drained: 0

    # ── Pagination ─────────────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
      properties:
        total:
          type: integer
          description: Total number of matching records.
          examples:
            - 42
        page:
          type: integer
          description: Current page number (1-indexed).
          examples:
            - 1
        limit:
          type: integer
          description: Number of items per page.
          examples:
            - 25
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for fetching the next page; null if on last page.
        prev_cursor:
          type: string
          nullable: true
          description: Opaque cursor for fetching the previous page; null if on first page.

    StreamListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Stream"

    # ── Health ─────────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required:
        - status
        - version
        - uptime
      properties:
        status:
          type: string
          enum: [ok]
          description: Always "ok" for a live process.
        version:
          type: string
          description: Service version from npm_package_version.
          examples:
            - "2.0.0"
        uptime:
          type: integer
          description: Process uptime in seconds.
          examples:
            - 86400
        horizon_circuit:
          type: string
          enum: [closed, open, half_open]
          description: Current state of the Horizon circuit breaker.
          examples:
            - "closed"

    ReadyResponse:
      type: object
      required:
        - status
        - version
        - uptime
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          examples:
            - "2.0.0"
        uptime:
          type: integer
          examples:
            - 3600
        contract_version:
          type: string
          description: Deployed contract version string, or "unknown".
          examples:
            - "ledger-52000000"
        checks:
          type: object
          description: Map of subsystem name to health status.
          additionalProperties:
            type: string
            enum: [ok, error]
          examples:
            - db: ok
              rpc: ok

    # ── Errors ─────────────────────────────────────────────────────────────────
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Machine-readable error code or human-readable message.
          examples:
            - "not_found"

    ValidationError:
      type: object
      required:
        - error
        - fields
      properties:
        error:
          type: string
          enum: [validation_failed]
          description: Always "validation_failed" for 400 validation errors.
        fields:
          type: array
          description: Per-field validation failure details.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: >
                  Dot-notation path to the invalid field (e.g. "recipient",
                  "query.page"). "_root" for top-level errors.
                examples:
                  - "recipient"
              message:
                type: string
                description: Human-readable description of the validation failure.
                examples:
                  - "Must be a valid Stellar public key (G followed by 55 base-32 characters)"

  # ─────────────────────────────────────────────────────────────────────────
  # Reusable parameters
  # ─────────────────────────────────────────────────────────────────────────
  parameters:
    RecipientParam:
      name: recipient
      in: path
      required: true
      description: Stellar public key (G-address) of the stream recipient.
      schema:
        $ref: "#/components/schemas/StellarAddress"

    PageParam:
      name: page
      in: query
      required: false
      description: 1-indexed page number. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of items per page (1–100). Defaults to 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous response.
      schema:
        type: string

  # ─────────────────────────────────────────────────────────────────────────
  # Reusable responses
  # ─────────────────────────────────────────────────────────────────────────
  responses:
    ValidationErrorResponse:
      description: Request validation failed — one or more fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error: validation_failed
            fields:
              - field: recipient
                message: >
                  Must be a valid Stellar public key
                  (G followed by 55 base-32 characters)

    NotFoundResponse:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found

    UnauthorizedResponse:
      description: Missing or invalid JWT Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized

    RateLimitResponse:
      description: Too many requests — rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many requests

    InternalErrorResponse:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Internal server error

# =============================================================================
# Paths
# =============================================================================
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      summary: Liveness probe
      description: >
        Returns 200 while the process is running. Used by container
        orchestrators (ECS, Kubernetes) as a liveness check. Does not perform
        deep dependency checks.
      operationId: getHealth
      tags: [Health]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                version: "2.0.0"
                uptime: 86400
                horizon_circuit: closed

  /ready:
    get:
      summary: Readiness probe
      description: >
        Checks that all dependencies (database, optional RPC) are reachable.
        Returns 200 when all checks pass, 503 when any check fails.
        Used by container orchestrators to gate traffic.
      operationId: getReady
      tags: [Health]
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ok
                version: "2.0.0"
                uptime: 3600
                contract_version: ledger-52000000
                checks:
                  db: ok
                  rpc: ok
        "503":
          description: One or more dependency checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: degraded
                version: "2.0.0"
                uptime: 3600
                contract_version: unknown
                checks:
                  db: error
                  rpc: ok

  # ── Streams ──────────────────────────────────────────────────────────────────
  /api/streams/{recipient}:
    get:
      summary: Get stream by recipient
      description: >
        Returns the indexed vesting stream for the given recipient address,
        including current claimable amount, cliff state, and stream parameters.
      operationId: getStreamByRecipient
      tags: [Streams]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecipientParam"
      responses:
        "200":
          description: Stream found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
              example:
                recipient: GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN
                sponsor: GBKPCL6MBNDKLGXFVYQUQZKPUV4NGZKUOPGSNK2E3PO3MPXWL6BFQQH
                token: CCJZ5DPSLXROYIQ373NBNANGKKBKM4DZJMKBMJDUZM4DZJMKBMJDUZM4
                rate_per_ledger: "1000"
                start_ledger: 52000000
                cliff_ledger: 52017280
                end_ledger: 52172800
                status: active
                cancelled_at: null
                claimable_amount: "5000000"
                created_at: "2026-01-15T10:30:00Z"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/RateLimitResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/streams/{recipient}/status:
    get:
      summary: Get stream status
      description: >
        Returns the current lifecycle status for a recipient's stream.
        This reflects the database-persisted state machine value, updated
        atomically on each indexed event and by the background expiry job.
      operationId: getStreamStatus
      tags: [Streams]
      parameters:
        - $ref: "#/components/parameters/RecipientParam"
      responses:
        "200":
          description: Status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStatus_Endpoint"
              example:
                recipient: GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN
                status: active
                updated_at: "2026-01-15T10:30:00Z"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/streams/{recipient}/build-claim-tx:
    post:
      summary: Build unsigned claim transaction
      description: >
        Builds an unsigned Soroban transaction envelope that calls
        `claim_vested` for the given recipient. The caller must sign the
        returned XDR with the recipient's private key and submit it to
        Horizon.

        Requires JWT authentication where the JWT sub matches the recipient
        address.
      operationId: buildClaimTransaction
      tags: [Streams]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecipientParam"
      responses:
        "200":
          description: Unsigned transaction envelope built successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimTransactionEnvelope"
              example:
                transaction_xdr: "AAAAAgAAAAA..."
                network_passphrase: "Test SDF Network ; September 2015"
                fee_stroops: "100"
                expires_at: "2026-01-15T10:35:00Z"
        "400":
          description: >
            Validation failed or the cliff has not been reached, or there is
            nothing to claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                invalid_address:
                  summary: Invalid recipient address
                  value:
                    error: validation_failed
                    fields:
                      - field: recipient
                        message: >
                          Must be a valid Stellar public key
                          (G followed by 55 base-32 characters)
                nothing_to_claim:
                  summary: Nothing to claim
                  value:
                    error: nothing_to_claim
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "429":
          $ref: "#/components/responses/RateLimitResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  /api/streams:
    get:
      summary: List streams by sponsor
      description: >
        Returns a paginated list of vesting streams created by the given
        sponsor address. Supports filtering by status and sorting.

        Requires JWT authentication where the JWT sub matches the `sponsor`
        query parameter to prevent cross-sponsor data access.
      operationId: listStreams
      tags: [Streams]
      security:
        - BearerAuth: []
      parameters:
        - name: sponsor
          in: query
          required: true
          description: Stellar public key of the sponsor to list streams for.
          schema:
            $ref: "#/components/schemas/StellarAddress"
        - name: status
          in: query
          required: false
          description: Filter streams by lifecycle status.
          schema:
            $ref: "#/components/schemas/StreamStatus"
        - name: sort
          in: query
          required: false
          description: Sort order for the results.
          schema:
            type: string
            enum:
              - cliff_asc
              - cliff_desc
              - end_asc
              - end_desc
              - claimable_asc
              - claimable_desc
              - recipient_asc
              - recipient_desc
            default: cliff_asc
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated list of streams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamListResponse"
              example:
                items:
                  - recipient: GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWN
                    sponsor: GBKPCL6MBNDKLGXFVYQUQZKPUV4NGZKUOPGSNK2E3PO3MPXWL6BFQQH
                    token: CCJZ5DPSLXROYIQ373NBNANGKKBKM4DZJMKBMJDUZM4DZJMKBMJDUZM4
                    rate_per_ledger: "1000"
                    start_ledger: 52000000
                    cliff_ledger: 52017280
                    end_ledger: 52172800
                    status: active
                    cancelled_at: null
                    claimable_amount: "5000000"
                    created_at: "2026-01-15T10:30:00Z"
                total: 42
                page: 1
                limit: 25
                next_cursor: "eyJwYWdlIjoyLCJvZmZzZXQiOjI1fQ"
                prev_cursor: null
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "429":
          $ref: "#/components/responses/RateLimitResponse"
        "500":
          $ref: "#/components/responses/InternalErrorResponse"

  # ── Analytics ────────────────────────────────────────────────────────────────
  /api/analytics/summary:
    get:
      summary: Get global analytics summary
      description: >
        Returns aggregate statistics across all indexed streams: total stream
        count, value locked, total claimed, and a breakdown by status.
        Response is cached for 60 seconds.
      operationId: getAnalyticsSummary
      tags: [Analytics]
      responses:
        "200":
          description: Analytics summary.
          headers:
            Cache-Control:
              description: Cache control directive.
              schema:
                type: string
                examples:
                  - "public, max-age=60"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
              example:
                total_streams: 1247
                active_streams: 892
                total_value_locked: "9876543210000"
                total_claimed: "1234567890000"
                unique_sponsors: 143
                unique_recipients: 892
                by_status:
                  active: 600
                  pre_cliff: 292
                  expired: 210
                  cancelled: 145
                  drained: 0
        "500":
          $ref: "#/components/responses/InternalErrorResponse"
