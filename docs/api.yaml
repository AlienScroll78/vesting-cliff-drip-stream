openapi: "3.1.0"
info:
  title: Vesting Cliff Drip Stream API
  version: "1.0.0"
  description: |
    REST API for querying vesting schedules and claimable balances without
    running a Stellar node.  All view calls are simulated via Soroban RPC.

servers:
  - url: http://localhost:3001/api
    description: Local development
  - url: https://api.vesting.example.com/api
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256-signed JWT obtained from POST /api/auth/token.
        Payload: { sub: address, role: 'admin'|'user', exp, iat, kid }.

paths:
  # ── Auth (#742) ──────────────────────────────────────────────────────────────

  /auth/challenge:
    post:
      operationId: authChallenge
      summary: Request a sign-in challenge nonce
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  description: Stellar public key (G...)
      responses:
        "200":
          description: Challenge nonce issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce:       { type: string }
                  expires_in:  { type: integer, description: "Seconds until nonce expires (300)" }
                  created_at:  { type: integer, description: Unix millisecond timestamp }
                  message:     { type: string, description: "Exact string to sign: address:nonce:timestamp" }
        "400":
          description: Invalid address

  /auth/token:
    post:
      operationId: authToken
      summary: Exchange a signed challenge for a JWT
      tags: [Auth]
      description: |
        Sign the `message` string from `/auth/challenge` with your Stellar wallet's
        Ed25519 private key, base64-encode the 64-byte signature, then POST here.

        On success you receive:
          - `access_token`: RS256 JWT, 24-hour TTL
          - `refresh_token`: opaque 30-day token for token renewal
          - `role`: `admin` or `user` (admin if address is in `ADMIN_ADDRESSES` env)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, nonce, timestamp, signature]
              properties:
                address:   { type: string }
                nonce:     { type: string }
                timestamp: { type: integer }
                signature: { type: string, description: "Base64-encoded Ed25519 signature" }
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:  { type: string }
                  refresh_token: { type: string }
                  token_type:    { type: string, example: Bearer }
                  expires_in:    { type: integer, example: 86400 }
                  role:          { type: string, enum: [admin, user] }
        "400": { description: Missing/invalid fields or stale nonce }
        "401": { description: Signature verification failed }

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh an access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type:   { type: string, example: Bearer }
                  expires_in:   { type: integer, example: 86400 }
                  role:         { type: string, enum: [admin, user] }
        "401": { description: Refresh token not found or expired }

  /.well-known/jwks.json:
    get:
      operationId: jwks
      summary: Public keys for RS256 JWT verification
      tags: [Auth]
      responses:
        "200":
          description: JWKS key set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty: { type: string, example: RSA }
                        kid: { type: string }
                        use: { type: string, example: sig }
                        alg: { type: string, example: RS256 }
                        n:   { type: string }
                        e:   { type: string }

  # ── Admin contract endpoints (#742) ──────────────────────────────────────────

  /admin/set_min_deposit:
    post:
      operationId: setMinDeposit
      summary: Update the contract's minimum deposit threshold
      tags: [Admin]
      security:
        - bearerAuth: []
      description: |
        Requires JWT with `role=admin`.
        Returns 401 if unauthenticated, 403 if role is not admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min_deposit]
              properties:
                min_deposit:
                  type: string
                  description: New minimum deposit as a decimal integer string (i128)
                  example: "1000000"
      responses:
        "200":
          description: Contract updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:          { type: boolean }
                  min_deposit: { type: string }
                  tx_hash:     { type: string }
        "400": { description: Invalid min_deposit value }
        "401": { description: Missing or invalid JWT }
        "403": { description: JWT role is not admin }
        "502": { description: Soroban RPC error }

  /admin/pause_stream:
    post:
      operationId: pauseStream
      summary: Pause a vesting stream for a recipient
      tags: [Admin]
      security:
        - bearerAuth: []
      description: |
        Requires JWT with `role=admin`.
        Returns 401 if unauthenticated, 403 if role is not admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient:
                  type: string
                  description: Stellar public key of the stream recipient
      responses:
        "200":
          description: Stream paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:        { type: boolean }
                  recipient: { type: string }
                  tx_hash:   { type: string }
        "400": { description: Invalid recipient address }
        "401": { description: Missing or invalid JWT }
        "403": { description: JWT role is not admin }
        "502": { description: Soroban RPC error }

  /schedules/{recipient}:
    get:
      operationId: getSchedule
      summary: Get vesting schedule for a recipient
      parameters:
        - name: recipient
          in: path
          required: true
          schema:
            type: string
          description: Stellar account ID (G...)
      responses:
        "200":
          description: Vesting schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VestingSchedule"
        "404":
          description: No schedule found for recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: RPC or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/sponsor/{sponsor}:
    get:
      operationId: getSchedulesBySponsor
      summary: List vesting schedules created by a sponsor (paginated)
      parameters:
        - name: sponsor
          in: path
          required: true
          schema:
            type: string
          description: Stellar account ID (G...) of the sponsor
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Horizon paging token for cursor-based pagination
      responses:
        "200":
          description: Paginated list of stream summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorSchedulesPage"
        "502":
          description: Horizon unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /claimable/{recipient}:
    get:
      operationId: getClaimable
      summary: Get the current claimable token amount for a recipient
      parameters:
        - name: recipient
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claimable amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimableResponse"
        "500":
          description: RPC or server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  schemas:
    VestingSchedule:
      type: object
      required:
        - recipient
        - sponsor
        - token
        - rate
        - cliff_ledger
        - end_ledger
        - start_ledger
        - claimable_amount
        - is_cliff_passed
      properties:
        recipient:
          type: string
        sponsor:
          type: string
        token:
          type: string
        rate:
          type: string
          description: Tokens per ledger (as string to preserve i128 precision)
        cliff_ledger:
          type: integer
        end_ledger:
          type: integer
        start_ledger:
          type: integer
        claimable_amount:
          type: string
          description: Currently claimable tokens (as string)
        is_cliff_passed:
          type: boolean

    ClaimableResponse:
      type: object
      required: [recipient, claimable_amount]
      properties:
        recipient:
          type: string
        claimable_amount:
          type: string

    SponsorSchedulesPage:
      type: object
      required: [items, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StreamSummary"
        page:
          type: integer
        limit:
          type: integer
        next_cursor:
          type: string
          nullable: true

    StreamSummary:
      type: object
      properties:
        recipient:
          type: string
        sponsor:
          type: string
        token:
          type: string
        ledger:
          type: integer
        event_id:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
