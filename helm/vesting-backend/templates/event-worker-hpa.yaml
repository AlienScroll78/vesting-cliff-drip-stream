{{- if and .Values.eventWorker.enabled .Values.eventWorker.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "vesting-backend.fullname" . }}-event-worker
  labels:
    {{- include "vesting-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "vesting-backend.fullname" . }}-event-worker
  minReplicas: {{ .Values.eventWorker.hpa.minReplicas }}
  maxReplicas: {{ .Values.eventWorker.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.eventWorker.hpa.targetCPUUtilizationPercentage }}
{{- end }}
