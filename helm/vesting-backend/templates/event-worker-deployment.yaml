{{- if .Values.eventWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vesting-backend.fullname" . }}-event-worker
  labels:
    {{- include "vesting-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-worker
spec:
  replicas: {{ .Values.eventWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "vesting-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: event-worker
  template:
    metadata:
      annotations:
        checksum/secret: {{ .Values.externalSecret.remoteSecrets | toYaml | sha256sum }}
        {{- with .Values.eventWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "vesting-backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: event-worker
    spec:
      serviceAccountName: {{ include "vesting-backend.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: event-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.eventWorker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: {{ include "vesting-backend.fullname" . }}-event-worker
            {{- if .Values.logging.fluentBit.enabled }}
            - name: LOG_FILE_PATH
              value: /var/log/vesting/application.jsonl
            - name: LOG_LEVEL_FILE
              value: /etc/vesting/logging/log-level
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "vesting-backend.fullname" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "vesting-backend.fullname" . }}
            {{- end }}
          resources:
            {{- toYaml .Values.eventWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.logging.fluentBit.enabled }}
            - name: application-logs
              mountPath: /var/log/vesting
            {{- end }}
            {{- if .Values.logging.fluentBit.enabled }}
            - name: fluent-bit-config
              mountPath: /etc/vesting/logging
              readOnly: true
            {{- end }}
        {{- if .Values.logging.fluentBit.enabled }}
        - name: fluent-bit
          image: {{ .Values.logging.fluentBit.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: AWS_REGION
              value: {{ .Values.logging.fluentBit.awsRegion | quote }}
            - name: CLOUDWATCH_LOG_GROUP
              value: {{ printf "%s/event-worker" .Values.logging.fluentBit.logGroupPrefix | quote }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - --config=/fluent-bit/etc/fluent-bit.conf
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: application-logs
              mountPath: /var/log/vesting
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: fluent-bit-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.logging.fluentBit.enabled }}
        - name: application-logs
          emptyDir: {}
        - name: fluent-bit-config
          configMap:
            name: {{ include "vesting-backend.fullname" . }}-fluent-bit
        - name: fluent-bit-tmp
          emptyDir: {}
        {{- end }}
{{- end }}
