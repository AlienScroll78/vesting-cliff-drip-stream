name: Mutation Test Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.rs"
      - ".cargo-mutants.toml"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation-score:
    name: mutation-score
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants
        run: |
          cargo install cargo-mutants --locked --version "24.9.0"

      - name: Run mutation tests
        run: |
          cargo mutants --features testutils \
            --file src/contract.rs \
            --file src/storage.rs \
            --output mutants.out \
            --jobs 2
        continue-on-error: true

      - name: Check mutation score ≥ 95%
        run: |
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "::error::outcomes.json not found — cargo mutants may have failed to run."
            exit 1
          fi

          CAUGHT=$(jq '.caught | length' mutants.out/outcomes.json)
          MISSED=$(jq '.missed | length' mutants.out/outcomes.json)
          TOTAL=$((CAUGHT + MISSED))

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No mutants found. Check cargo-mutants configuration."
            exit 1
          fi

          # Integer arithmetic: score_x100 = caught * 100 * 100 / total (2 decimal places)
          SCORE_X100=$((CAUGHT * 10000 / TOTAL))
          SCORE_INT=$((SCORE_X100 / 100))
          SCORE_FRAC=$((SCORE_X100 % 100))

          echo "Mutation score: ${SCORE_INT}.${SCORE_FRAC}% (${CAUGHT} killed of ${TOTAL})"

          # Fail if score < 95.00%
          if [ "$SCORE_X100" -lt 9500 ]; then
            echo "::error::Mutation score ${SCORE_INT}.${SCORE_FRAC}% is below the 95% threshold."
            echo "Missed mutants:"
            jq -r '.missed[] | "  \(.file):\(.line) — \(.mutation)"' mutants.out/outcomes.json 2>/dev/null || true
            exit 1
          fi

          echo "✅ Mutation score ${SCORE_INT}.${SCORE_FRAC}% meets the 95% threshold."

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutants.out/
          retention-days: 14
