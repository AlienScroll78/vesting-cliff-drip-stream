# ─────────────────────────────────────────────────────────────────────────────
# contract-upgrade-tests.yml — issue #782: Contract upgrade test CI job
#
# Runs the upgrade / state-migration test suite on every pull request and
# on pushes to main, ensuring contract upgrades never break existing streams.
# ─────────────────────────────────────────────────────────────────────────────

name: Contract Upgrade Tests

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  upgrade-tests:
    name: Contract upgrade & migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-upgrade-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-upgrade-

      - name: Run upgrade & migration tests
        run: cargo test --features testutils test_migration -- --nocapture
        timeout-minutes: 10
