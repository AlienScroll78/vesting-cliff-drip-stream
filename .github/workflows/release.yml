name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: rust
          token: ${{ secrets.GITHUB_TOKEN }}

  attach-wasm:
    name: Build & Attach WASM artifact
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build optimized WASM
        run: make build

      - name: Upload WASM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: target/wasm32-unknown-unknown/release/*.wasm

  release-notes-summary:
    name: Append dependency & license summary to release notes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # ── Rust dependency count ──────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-relnotes-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-relnotes-

      - name: Install cargo-license
        run: cargo install cargo-license --locked

      - name: Collect Rust license data
        run: cargo license --json > rust-licenses.json

      # ── Node.js dependency counts ──────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root Node.js dependencies
        run: npm ci

      - name: Install license-checker
        run: npm install -g license-checker@25.0.1

      - name: Collect root Node.js license data
        run: license-checker --json --out root-node-licenses.json

      - name: Install frontend Node.js dependencies
        run: npm ci
        working-directory: frontend

      - name: Collect frontend Node.js license data
        run: license-checker --json --out frontend-node-licenses.json
        working-directory: frontend

      # ── Build the summary and append it to the release body ─
      - name: Build and append summary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python3 - <<'PYEOF'
          import json, collections, os, subprocess, sys

          def count_licenses(path):
              with open(path) as f:
                  data = json.load(f)
              counter = collections.Counter()
              no_lic = 0
              if isinstance(data, list):
                  # cargo-license format: list of {name, version, license, ...}
                  for pkg in data:
                      lic = pkg.get("license") or ""
                      if not lic:
                          no_lic += 1
                      else:
                          counter[lic] += 1
                  return len(data), counter, no_lic
              else:
                  # license-checker format: dict of {pkgId: {licenses, ...}}
                  for pkg_id, info in data.items():
                      lic = (info.get("licenses") or "").replace("*", "")
                      if not lic:
                          no_lic += 1
                      else:
                          counter[lic] += 1
                  return len(data), counter, no_lic

          rust_total, rust_licenses, rust_nolic = count_licenses("rust-licenses.json")
          root_total, root_licenses, root_nolic = count_licenses("root-node-licenses.json")
          fe_total,   fe_licenses,   fe_nolic   = count_licenses("frontend/frontend-node-licenses.json")

          def table_rows(counter):
              rows = []
              for lic, cnt in sorted(counter.items(), key=lambda x: -x[1]):
                  rows.append(f"| `{lic}` | {cnt} |")
              return "\n".join(rows)

          summary = f"""
          ## 📦 Dependency & License Summary

          | Scope | Package count |
          |-------|---------------|
          | Rust (Cargo) | {rust_total} |
          | Node.js – root | {root_total} |
          | Node.js – frontend | {fe_total} |
          | **Total** | **{rust_total + root_total + fe_total}** |

          ### Rust license distribution

          | License | Count |
          |---------|-------|
          {table_rows(rust_licenses)}

          ### Node.js (root) license distribution

          | License | Count |
          |---------|-------|
          {table_rows(root_licenses)}

          ### Node.js (frontend) license distribution

          | License | Count |
          |---------|-------|
          {table_rows(fe_licenses)}

          > Full SBOM (SPDX 2.3 JSON) is attached to this release as `sbom.spdx.json`.
          > License policy: see [`.license-policy.json`](.license-policy.json) and [`docs/sbom.md`](docs/sbom.md).
          """

          # De-indent
          summary = "\n".join(line.lstrip() for line in summary.splitlines()).strip()

          tag = os.environ["TAG_NAME"]

          # Fetch current release body
          result = subprocess.run(
              ["gh", "release", "view", tag, "--json", "body", "--jq", ".body"],
              capture_output=True, text=True, check=True
          )
          current_body = result.stdout.strip()

          # Append summary (avoid duplicating if workflow reruns)
          marker = "## 📦 Dependency & License Summary"
          if marker in current_body:
              new_body = current_body[:current_body.index(marker)].rstrip() + "\n\n" + summary
          else:
              new_body = current_body + "\n\n" + summary

          subprocess.run(
              ["gh", "release", "edit", tag, "--notes", new_body],
              check=True
          )
          print("Release notes updated successfully.")
          PYEOF
