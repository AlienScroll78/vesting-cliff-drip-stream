name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  # ── Rust contract tests (includes event snapshot tests – #363) ──────────────
  contract-tests:
    name: Rust contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run all Rust tests (including event snapshots)
        run: cargo test --features testutils
        env:
          # Set to 1 to regenerate snapshot JSON files
          UPDATE_SNAPSHOTS: "0"

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-snapshots
          path: src/tests/snapshots/

  # ── Playwright E2E – cross-browser matrix (#362 axe-core, #364 browsers) ───
  playwright:
    name: "Playwright E2E – ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # let all browsers run even if one fails
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser – ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests – ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}

      - name: Upload Playwright report – ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload accessibility violation reports – ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports-${{ matrix.browser }}
          path: frontend/test-results/a11y-reports/
          retention-days: 14

      - name: Upload test results – ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 14

  # ── Database migration tests (#365) ─────────────────────────────────────────
  migration-tests:
    name: Database migration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run migration tests
        run: npm run test:migrations
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vesting_test
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NODE_ENV: test
