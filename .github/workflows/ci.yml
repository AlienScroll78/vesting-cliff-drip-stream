name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── lint ────────────────────────────────────────────────────────────────────
  # Required status check: "lint"
  # Runs cargo fmt and clippy. Both must be clean.
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # Exclude db-tests: it targets the host, not WASM.
        run: cargo clippy --all-targets --all-features --exclude db-tests -- -D warnings

      - name: Setup Node for JSON log lint
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend logger dependencies
        run: npm install --prefix backend --no-save --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Validate structured log JSON
        working-directory: backend
        run: node scripts/validate-structured-logs.mjs

  # ── contract-test ───────────────────────────────────────────────────────────
  # Required status check: "contract-test"
  # Runs the full Soroban test suite with testutils enabled.
  contract-test:
    name: contract-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract tests
        run: cargo test --features testutils

  # ── build ───────────────────────────────────────────────────────────────────
  # Required status check: "build"
  # Compiles to wasm32 (the production target) and generates rustdoc.
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --exclude db-tests

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --exclude db-tests

  db-tests:
    name: db-tests (PostgreSQL integration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # The workspace .cargo/config.toml defaults to wasm32; we must
          # install the native target so the --target flag below is accepted.
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-db-${{ hashFiles('db-tests/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-db-

      # testcontainers-rs uses the Docker socket — Docker is pre-installed on
      # ubuntu-latest GitHub-hosted runners, no extra setup required.
      - name: Run DB integration tests
        # Pass --target explicitly to override the workspace wasm32 default.
        run: >
          cargo test
          -p db-tests
          --target x86_64-unknown-linux-gnu
          --no-fail-fast
        timeout-minutes: 10

  # ── typecheck ───────────────────────────────────────────────────────────────
  # Required status check: "typecheck"
  # TypeScript type-check for the frontend.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck
