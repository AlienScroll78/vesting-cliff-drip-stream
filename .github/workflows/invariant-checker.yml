# ─────────────────────────────────────────────────────────────────────────────
# invariant-checker.yml — issue #790: Contract invariant checker CI job
#
# Runs the full contract test suite (which now includes assert_stream_invariants
# calls) on every pull request and on pushes to main.
# ─────────────────────────────────────────────────────────────────────────────

name: Contract Invariant Checker

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  invariant-tests:
    name: Contract invariant checker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-invariants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-invariants-

      - name: Run invariant checker tests
        run: cargo test --features testutils invariants -- --nocapture
        timeout-minutes: 10
