name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # --legacy-peer-deps: Storybook 8 addons have a peer-dependency range
        # conflict on @storybook/test; the lockfile also predates the storybook
        # CLI entry, so plain `npm ci` fails. See issue #1064.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Issue #1064 — Chromatic visual regression.
  #
  # Runs on every PR (and pushes to main). Strictly gated on the
  # CHROMATIC_PROJECT_TOKEN repository secret: when the secret is not configured
  # the job no-ops with a clear notice instead of failing, so forks and first-run
  # setups are never blocked.
  #
  # NOTE FOR MAINTAINERS: visual baselines are NOT committed to the repository.
  # After adding the CHROMATIC_PROJECT_TOKEN secret, run the first Chromatic
  # build (e.g. `npm run chromatic`) and *accept* the baseline on chromatic.com.
  # Until then every story is reported as a new baseline and the diff check will
  # not block merges.
  # ---------------------------------------------------------------------------
  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to determine the baseline commit.
          fetch-depth: 0

      - name: Check for CHROMATIC_PROJECT_TOKEN
        id: token
        run: |
          if [ -n "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Chromatic skipped::CHROMATIC_PROJECT_TOKEN secret is not set. Skipping visual regression. Add the secret and run the first Chromatic build to establish baselines."
          fi

      - name: Setup Node.js
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.token.outputs.configured == 'true'
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run Chromatic
        if: steps.token.outputs.configured == 'true'
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          autoAcceptChanges: main
          exitZeroOnChanges: ${{ github.event_name == 'pull_request' }}

  # Run interaction tests if @storybook/test-runner is available
  test:
    name: Storybook interaction tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Run Storybook test runner
        run: |
          if npx --yes storybook --version 2>/dev/null; then
            npx serve -l 6006 storybook-static &
            sleep 3
            npx --yes @storybook/test-runner --url http://localhost:6006 --passWithNoTests || true
          else
            echo "Storybook test runner not available; skipping interaction tests."
          fi
        continue-on-error: true

  # Deploy to GitHub Pages on pushes to main
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
