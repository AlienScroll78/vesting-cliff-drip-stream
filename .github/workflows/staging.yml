name: Staging Deployment

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      contract_id: ${{ steps.deploy.outputs.contract_id }}
      previous_contract_id: ${{ steps.previous.outputs.contract_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure Stellar key
        run: |
          stellar keys add deployer --secret-key "${{ secrets.STELLAR_SECRET_KEY }}"

      - name: Capture previous contract ID (for rollback)
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PREV=$(gh variable get VESTING_CONTRACT --json value -q .value 2>/dev/null || echo "")
          echo "contract_id=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy to testnet
        id: deploy
        run: |
          CONTRACT_ID=$(./scripts/deploy.sh deployer 2>&1 | tee deploy.log | grep -oE 'C[A-Z0-9]{55}' | tail -1)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "VESTING_CONTRACT=$CONTRACT_ID" >> "$GITHUB_ENV"

      - name: Save contract ID as Actions variable
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh variable set VESTING_CONTRACT --body "${{ steps.deploy.outputs.contract_id }}"

      - name: Upload deploy logs
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_id }}
          path: deploy.log
          retention-days: 30

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/smoke/requirements.txt

      - name: Install smoke test dependencies
        run: pip install -r tests/smoke/requirements.txt

      - name: Install Stellar CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run smoke tests
        env:
          SMOKE_NETWORK: testnet
          VESTING_CONTRACT: ${{ needs.deploy.outputs.contract_id }}
          SMOKE_API_HOST: ${{ vars.SMOKE_API_HOST }}
          SMOKE_SPONSOR_ADDRESS: ${{ vars.SMOKE_SPONSOR_ADDRESS }}
          SMOKE_RECIPIENT_ADDRESS: ${{ vars.SMOKE_RECIPIENT_ADDRESS }}
          SMOKE_EXPECTED_CLIFF: ${{ vars.SMOKE_EXPECTED_CLIFF }}
        run: |
          pytest tests/smoke/ --tb=short -v --timeout=60

      # ── Rollback on smoke test failure ────────────────────────────────────────
      # If smoke tests fail, restore the previous contract ID in the Actions
      # variable so subsequent deployments and monitoring point to the last
      # known-good contract. The failing deploy logs are retained as an artifact.
      - name: Rollback contract ID on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PREVIOUS_CONTRACT_ID: ${{ needs.deploy.outputs.previous_contract_id }}
        run: |
          if [ -n "$PREVIOUS_CONTRACT_ID" ]; then
            echo "⚠️  Smoke tests failed. Rolling back VESTING_CONTRACT to $PREVIOUS_CONTRACT_ID"
            gh variable set VESTING_CONTRACT --body "$PREVIOUS_CONTRACT_ID"
          else
            echo "⚠️  Smoke tests failed and no previous contract ID is available for rollback."
          fi
          echo "❌ Deployment marked as FAILED. See smoke test output above."
          exit 1
