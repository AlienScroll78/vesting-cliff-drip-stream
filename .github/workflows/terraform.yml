name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate:
    name: Validate & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: terraform fmt
        run: terraform fmt -recursive -check

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: Plan (staging)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform
    env:
      TF_DATA_DIR: ${{ github.workspace }}/terraform/.terraform/staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: terraform init
        run: |
          terraform init \
            -input=false \
            -backend-config="envs/staging.backend.hcl"

      - name: terraform plan
        id: plan
        run: |
          terraform plan \
            -lock-timeout=5m \
            -var-file="envs/staging.tfvars" \
            -var="slack_webhook_url=https://hooks.slack.com/services/bootstrap" \
            -var="cost_alert_emails=[ops@example.com]" \
            -input=false \
            -no-color \
            -out=tfplan
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_FILE: terraform/tfplan
        with:
          script: |
            const cp = require('child_process');
            // `tfplan` is a binary archive, so render it with terraform rather
            // than reading it as text.
            const output = cp.execSync('terraform show -no-color tfplan || true', {
              cwd: 'terraform',
              encoding: 'utf8',
            });
            const lines = output.split('\n').slice(0, 200).join('\n');
            const comment = `## Terraform Plan (staging)\n\n\`\`\`\n${lines}\n\`\`\`\n`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  cost:
    name: Cost estimate
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check Infracost key
        id: check
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "INFRACOST_API_KEY is not set; skipping the cost estimate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - name: Setup Terraform
        if: steps.check.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Setup Infracost
        if: steps.check.outputs.enabled == 'true'
        uses: infracost/actions/setup-infracost@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost breakdown
        if: steps.check.outputs.enabled == 'true'
        run: |
          infracost breakdown \
            --path . \
            --config-file ../.github/infracost.yml \
            --format json \
            --out-file infracost.json
        continue-on-error: true

      - name: Comment cost delta on PR
        if: steps.check.outputs.enabled == 'true'
        uses: infracost/actions/comment@v3
        with:
          path: terraform/infracost.json
          github_token: ${{ secrets.GITHUB_TOKEN }}
          policy: update-comment
