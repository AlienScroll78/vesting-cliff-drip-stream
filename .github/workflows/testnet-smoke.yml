name: Testnet Smoke Test

# Run on every PR targeting main and on direct pushes to main.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: testnet-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  STELLAR_NETWORK: testnet
  SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  HORIZON_URL: https://horizon-testnet.stellar.org
  NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

jobs:
  # ── build-wasm ──────────────────────────────────────────────────────────────
  # Build and optimise the contract WASM before deploying.
  build-wasm:
    name: build-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build WASM (release)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Optimise WASM
        run: |
          stellar contract optimize \
            --wasm target/wasm32-unknown-unknown/release/vesting_cliff_drip_stream.wasm \
            --wasm-out target/vesting_cliff_drip_stream.optimized.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/vesting_cliff_drip_stream.optimized.wasm
          retention-days: 7

  # ── testnet-smoke ───────────────────────────────────────────────────────────
  # Deploy to testnet and run a full end-to-end smoke sequence:
  #   1. Deploy contract
  #   2. initialize
  #   3. create_vesting_stream
  #   4. Advance ledgers (bump via testnet faucet / RPC)
  #   5. claim_vested and verify returned amount
  #   6. cancel_stream and verify refund
  testnet-smoke:
    name: testnet-smoke
    runs-on: ubuntu-latest
    needs: build-wasm

    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      # ── Fund accounts ───────────────────────────────────────────────────────
      - name: Generate deployer keypair and fund via Friendbot
        id: deployer
        run: |
          DEPLOYER_SECRET=$(stellar keys generate deployer --no-fund --quiet)
          DEPLOYER_ADDRESS=$(stellar keys address deployer)

          echo "DEPLOYER_ADDRESS=$DEPLOYER_ADDRESS" >> "$GITHUB_ENV"

          # Fund via Horizon Friendbot (testnet only)
          curl -sf "https://friendbot.stellar.org?addr=${DEPLOYER_ADDRESS}" | \
            jq -r '.hash' || echo "Friendbot: already funded or rate-limited (continuing)"

          # Give Friendbot a moment to settle
          sleep 3

      - name: Generate sponsor keypair and fund via Friendbot
        id: sponsor
        run: |
          SPONSOR_SECRET=$(stellar keys generate sponsor --no-fund --quiet)
          SPONSOR_ADDRESS=$(stellar keys address sponsor)

          echo "SPONSOR_ADDRESS=$SPONSOR_ADDRESS" >> "$GITHUB_ENV"

          curl -sf "https://friendbot.stellar.org?addr=${SPONSOR_ADDRESS}" | \
            jq -r '.hash' || echo "Friendbot: already funded or rate-limited (continuing)"

          sleep 3

      - name: Generate recipient keypair
        run: |
          stellar keys generate recipient --no-fund --quiet
          RECIPIENT_ADDRESS=$(stellar keys address recipient)
          echo "RECIPIENT_ADDRESS=$RECIPIENT_ADDRESS" >> "$GITHUB_ENV"

      # ── Deploy ──────────────────────────────────────────────────────────────
      - name: Deploy contract to testnet
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/vesting_cliff_drip_stream.optimized.wasm \
            --source deployer \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE")

          echo "CONTRACT_ID=$CONTRACT_ID" >> "$GITHUB_ENV"
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: $CONTRACT_ID"

      # ── Save contract ID as CI artifact ─────────────────────────────────────
      - name: Save contract ID artifact
        run: |
          mkdir -p artifacts
          echo "$CONTRACT_ID" > artifacts/contract_id.txt
          echo "Deployed to testnet: $CONTRACT_ID" > artifacts/deployment_summary.txt
          echo "Deployed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> artifacts/deployment_summary.txt
          echo "Git SHA: ${{ github.sha }}" >> artifacts/deployment_summary.txt

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment
          path: artifacts/
          retention-days: 30

      # ── Deploy a SAC test token ─────────────────────────────────────────────
      - name: Deploy a Stellar Asset Contract token for testing
        run: |
          # Deploy a wrapped native token contract for smoke testing.
          # On testnet the native XLM SAC is the simplest asset to wrap.
          TOKEN_ID=$(stellar contract asset deploy \
            --asset native \
            --source deployer \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" 2>/dev/null || \
          stellar contract asset id \
            --asset native \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE")
          echo "TOKEN_ID=$TOKEN_ID" >> "$GITHUB_ENV"
          echo "SAC token contract: $TOKEN_ID"

      # ── Smoke Step 1: initialize ─────────────────────────────────────────────
      - name: Smoke step 1 — initialize contract
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            -- initialize \
            --admin "$DEPLOYER_ADDRESS" \
            --fee_bps 0 \
            --treasury "$DEPLOYER_ADDRESS"
          echo "✓ Contract initialized"

      # ── Smoke Step 2: create_vesting_stream ─────────────────────────────────
      - name: Smoke step 2 — create test vesting stream
        run: |
          # Parameters:
          #   rate     = RATE_DECIMALS * 100 = 1_000_000_000  (100 XLM/ledger)
          #   cliff    = 10 ledgers
          #   duration = 50 ledgers
          #   deposit  = 100 * 50 = 5_000 XLM (base units, assuming 7 decimals → 50_000_000_000 stroops)
          #
          # For simplicity we use the testnet native SAC which wraps XLM.
          # The sponsor must have enough XLM to cover the deposit.

          RATE="1000000000"     # 100 tokens/ledger * RATE_DECIMALS (10_000_000)
          CLIFF_DURATION="10"
          TOTAL_DURATION="50"

          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source sponsor \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            -- create_vesting_stream \
            --sponsor "$SPONSOR_ADDRESS" \
            --recipient "$RECIPIENT_ADDRESS" \
            --token "$TOKEN_ID" \
            --rate "$RATE" \
            --cliff_duration "$CLIFF_DURATION" \
            --total_duration "$TOTAL_DURATION" \
            --metadata null
          echo "✓ Stream created"

      # ── Smoke Step 3: verify schedule exists ─────────────────────────────────
      - name: Smoke step 3 — get_schedule and verify
        run: |
          SCHEDULE=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            -- get_schedule \
            --recipient "$RECIPIENT_ADDRESS")

          echo "Schedule: $SCHEDULE"
          if [ "$SCHEDULE" = "null" ] || [ -z "$SCHEDULE" ]; then
            echo "✗ Schedule not found after creation"
            exit 1
          fi
          echo "✓ Schedule exists after creation"

      # ── Smoke Step 4: claimable_amount before cliff ──────────────────────────
      - name: Smoke step 4 — claimable_amount before cliff is 0
        run: |
          CLAIMABLE=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            -- claimable_amount \
            --recipient "$RECIPIENT_ADDRESS")

          echo "Claimable before cliff: $CLAIMABLE"
          if [ "$CLAIMABLE" != "0" ]; then
            echo "✗ Expected 0 before cliff, got $CLAIMABLE"
            exit 1
          fi
          echo "✓ claimable_amount == 0 before cliff"

      # ── Smoke Step 5: cancel_stream and verify refund ────────────────────────
      # We cancel instead of waiting for ledger advancement (testnet ledger
      # advance is outside our control). The cancel-before-cliff path returns
      # the full deposit to the sponsor.
      - name: Smoke step 5 — cancel_stream before cliff (full refund path)
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source sponsor \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            -- cancel_stream \
            --sponsor "$SPONSOR_ADDRESS" \
            --recipient "$RECIPIENT_ADDRESS"
          echo "✓ Stream cancelled"

      - name: Smoke step 5b — verify schedule removed after cancel
        run: |
          SCHEDULE=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            -- get_schedule \
            --recipient "$RECIPIENT_ADDRESS")

          echo "Schedule after cancel: $SCHEDULE"
          if [ "$SCHEDULE" != "null" ] && [ -n "$SCHEDULE" ]; then
            echo "✗ Schedule should be null after cancel"
            exit 1
          fi
          echo "✓ Schedule correctly removed after cancellation"

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Print smoke test summary
        run: |
          echo "================================================"
          echo "  Testnet Smoke Test — PASSED"
          echo "================================================"
          echo "  Contract ID : $CONTRACT_ID"
          echo "  Network     : testnet"
          echo "  Git SHA     : ${{ github.sha }}"
          echo "  Steps run   :"
          echo "    1. initialize          ✓"
          echo "    2. create_vesting_stream ✓"
          echo "    3. get_schedule        ✓"
          echo "    4. claimable_amount    ✓"
          echo "    5. cancel_stream       ✓"
          echo "================================================"
