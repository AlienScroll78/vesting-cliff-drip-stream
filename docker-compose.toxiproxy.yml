version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Resilience test infrastructure
#
# Services:
#   toxiproxy  – Shopify Toxiproxy proxy + control API
#   postgres   – Real database (proxied for fault injection)
#   redis      – Real cache (proxied for fault injection)
#   horizon    – Mock Horizon HTTP server (proxied for fault injection)
#   webhook    – Mock webhook delivery target
#
# Usage:
#   docker-compose -f docker-compose.toxiproxy.yml up -d
#   npm run test:resilience
#   docker-compose -f docker-compose.toxiproxy.yml down
# ─────────────────────────────────────────────────────────────────────────────

networks:
  resilience:
    driver: bridge

volumes:
  pgdata:

services:
  # ── Toxiproxy ──────────────────────────────────────────────────────────────
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    restart: unless-stopped
    ports:
      # Control API
      - "8474:8474"
      # Proxied Horizon (real: 1080 → proxied out: 18080)
      - "18080:18080"
      # Proxied Postgres (real: 5432 → proxied out: 15432)
      - "15432:15432"
      # Proxied Redis (real: 6379 → proxied out: 16379)
      - "16379:16379"
      # Proxied webhook target (real: 9000 → proxied out: 19000)
      - "19000:19000"
    networks:
      - resilience

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres_resilience
    restart: unless-stopped
    environment:
      POSTGRES_USER:     vesting
      POSTGRES_PASSWORD: vesting
      POSTGRES_DB:       vesting_test
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - resilience
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesting -d vesting_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_resilience
    restart: unless-stopped
    networks:
      - resilience
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Mock Horizon (WireMock) ────────────────────────────────────────────────
  horizon:
    image: wiremock/wiremock:3.3.1
    container_name: horizon_mock
    restart: unless-stopped
    command:
      - --port=1080
      - --verbose
    volumes:
      - ./tests/resilience/wiremock:/home/wiremock
    networks:
      - resilience
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Mock Webhook Target ────────────────────────────────────────────────────
  webhook-target:
    image: wiremock/wiremock:3.3.1
    container_name: webhook_target
    restart: unless-stopped
    command:
      - --port=9000
      - --verbose
    volumes:
      - ./tests/resilience/wiremock-webhook:/home/wiremock
    networks:
      - resilience
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
