apiVersion: cloudtrail.aws.upbound.io/v1beta1
kind: Trail
metadata:
  name: vesting-secrets-audit
spec:
  forProvider:
    name: vesting-secrets-audit
    s3BucketName: vesting-secrets-audit-logs
    includeGlobalServiceEvents: true
    isMultiRegionTrail: true
    enableLogFileValidation: true
    kmsKeyId: alias/vesting-secrets-audit
    eventSelector:
      - readWriteType: All
        includeManagementEvents: true
        dataResource:
          - type: AWS::SecretsManager::Secret
            values:
              - arn:aws:secretsmanager:us-east-1:*:secret:vesting/*
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eso-audit-config
  namespace: external-secrets
data:
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_FORMAT: "json"
  AUDIT_LOG_OUTPUT: "stdout"
  AUDIT_LOG_LEVEL: "info"
