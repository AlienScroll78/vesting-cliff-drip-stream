openapi: 3.0.3
info:
  title: Vesting Cliff Drip Stream API
  version: 1.0.0
  description: |
    REST API for the Vesting Cliff Drip Stream backend service
    (`backend/`, default port 3001).

    This specification is the **source of truth** for the backend REST API. It
    drives client code generation and contract testing:

    * `spectral` lints it in CI (`.github/workflows/openapi-lint.yml`),
    * `scripts/validate-openapi.js` checks structural completeness in CI
      (`.github/workflows/api-contract-tests.yml`),
    * [Schemathesis](https://schemathesis.readthedocs.io/) runs property-based
      contract tests against a live backend on every PR — every response the
      server produces must match a documented status code and response schema,
    * Swagger UI is served at `GET /docs` in non-production environments.

    ## Versioning

    Canonical data-plane endpoints are versioned under `/api/v1/...`. The
    legacy unversioned mounts (`/api/...` without the `v1` segment) remain
    served for backwards compatibility but are considered deprecated; new
    clients must use the `/api/v1/...` paths documented here. Infrastructure
    endpoints (`/health`, `/ready`, `/.well-known/jwks.json`, `/docs`) are
    intentionally unversioned.

    ## Authentication

    Wallet-based authentication (RS256 JWT):

    1. `POST /api/v1/auth/challenge` with a Stellar public key to obtain a
       nonce and the exact message string to sign,
    2. sign the message with the wallet's Ed25519 key,
    3. `POST /api/v1/auth/token` with the signature to obtain a Bearer JWT
       (24 h) and a refresh token (30 d),
    4. send `Authorization: Bearer <access_token>` on protected endpoints.

    Wallets listed in the server's `ADMIN_ADDRESSES` environment variable
    receive the `admin` role, required for `/api/v1/admin/*` endpoints.

    ## Rate limiting

    All public endpoints (everything except `/docs`) are rate limited per IP
    (Redis-backed sliding window, defaults: 100 req/min per IP, 10 req/min for
    write paths). Exceeding the limit produces `429` with a `retryAfter` field.

    ## Errors

    All error responses share the `Error` schema: `{"error": "<message>"}`.
    Request-validation failures use the richer `ValidationError` schema
    (`{"error": "validation_failed", "fields": [...]}`). Documented error
    codes per endpoint: 400, 401, 403, 404, 429, 500, 502, 503.

    ## WebSocket real-time updates

    A WebSocket endpoint supplements this REST API at `ws://<host>:3001/ws/claimable`:

    * client → server: `{"type": "subscribe", "recipient": "G..."}`,
    * server → client: `{"type": "snapshot", "claimable": "500", "ledger": 12345}`
      (immediate snapshot, `ledger` is `null` before the next ledger close),
      `{"type": "event", "event_type": "stream_created|tokens_claimed|stream_cancelled|stream_clawed_back|stream_drained", "recipient": "G...", "payload": {...}}`,
      `{"type": "error", "message": "..."}`.

    ## Out of scope

    The legacy edge server (`src/server/`, port 3000 — horizon health probes
    and the admin drain endpoint, spec at `docs/api.yaml`) and the loopback-only
    internal admin server (`backend/src/admin/server.ts`, port 3002) are not
    part of this specification.
  contact:
    name: Vesting Cliff Drip Stream maintainers
    url: https://github.com/AlienScroll78/vesting-cliff-drip-stream
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.dripswave.app
    description: Production
  - url: https://staging-api.dripswave.app
    description: Staging
  - url: http://localhost:3001
    description: Local development (backend service)
tags:
  - name: Health
    description: Liveness, readiness, and dependency probes.
  - name: Auth
    description: |
      Wallet-challenge authentication issuing RS256 JWTs. Endpoints for
      obtaining nonces, exchanging wallet signatures for tokens, refreshing
      tokens, and public-key discovery (JWKS).
  - name: Schedules
    description: |
      Read-only vesting schedule and claimable-balance queries backed by
      Soroban RPC simulations and Horizon contract events.
  - name: Analytics
    description: Aggregate sponsor statistics.
  - name: Admin
    description: |
      Administrative contract mutations. Require a Bearer JWT with the
      `admin` role; every call is audit-logged.
  - name: Docs
    description: |
      Interactive API documentation (Swagger UI) and the raw OpenAPI spec.
      Only served in non-production environments.
paths:
  /health:
    get:
      tags: [Health]
      summary: Service liveness with dependency checks
      description: |
        Checks PostgreSQL, Soroban RPC, and Redis connectivity. Returns `200`
        when every check passes and `503` with per-check status when any
        dependency is degraded. Suitable for liveness probes and humans; use
        `/ready` for load-balancer gating (it also checks indexer freshness).
      operationId: getHealth
      responses:
        '200':
          description: All dependency checks passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.0.0
                uptime: 120
                uptime_seconds: 120
                contract_version: 1.2.0
                checks:
                  db: ok
                  rpc: ok
                  redis: ok
                horizon_circuit: closed
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: |
            One or more dependency checks failed. The same
            `HealthResponse` body is returned with `status: "degraded"` and
            each failing check set to `"timeout or unavailable"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                version: 1.0.0
                uptime: 120
                uptime_seconds: 120
                contract_version: 1.2.0
                checks:
                  db: ok
                  rpc: timeout or unavailable
                  redis: ok
                horizon_circuit: closed
  /ready:
    get:
      tags: [Health]
      summary: Readiness including indexer freshness
      description: |
        Same checks as `/health` plus an indexer freshness check: the Horizon
        worker cursor must be less than 60 seconds behind. Returns `200` only
        when the service is fully ready to serve traffic.
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready (dependencies healthy, indexer fresh).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: ok
                version: 1.0.0
                uptime: 120
                uptime_seconds: 120
                contract_version: 1.2.0
                checks:
                  db: ok
                  rpc: ok
                  redis: ok
                  indexer: ok
                horizon_circuit: closed
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: |
            Not ready — a dependency is down or the indexer lags more than 60
            seconds behind chain tip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: degraded
                version: 1.0.0
                uptime: 120
                uptime_seconds: 120
                contract_version: 1.2.0
                checks:
                  db: ok
                  rpc: ok
                  redis: ok
                  indexer: lag > 60s
                horizon_circuit: closed
  /.well-known/jwks.json:
    get:
      tags: [Auth]
      summary: Public signing keys (JWKS)
      description: |
        RSA public keys used to verify RS256 access tokens, keyed by `kid`
        (the JWT header's `kid` claim selects the verification key). Includes
        the current key and the previously rotated key during grace windows.
      operationId: getJwks
      responses:
        '200':
          description: JWKS key set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
              example:
                keys:
                  - kty: RSA
                    kid: 9f86d081884c7d65
                    use: sig
                    alg: RS256
                    n: u8Mt6EB7ZtVUNHuCccjS6pFOnov4W-l7s8QGmDID0dR7vRQ
                    e: AQAB
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /docs:
    get:
      tags: [Docs]
      summary: Interactive API documentation (Swagger UI)
      description: |
        Serves Swagger UI backed by `api/openapi.yaml`. Only available in
        non-production environments (`NODE_ENV !== "production"`); returns
        `404` in production. The UI fetches the raw spec from
        `GET /docs/openapi.yaml`.
      operationId: getApiDocs
      responses:
        '200':
          description: Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string
              example: |
                <!DOCTYPE html>
                <html lang="en">
                <head><title>Vesting Cliff Drip Stream — API Docs</title></head>
                <body><div id="swagger-ui"></div></body>
                </html>
        '404':
          description: Returned in production environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
        '503':
          description: The OpenAPI spec file is missing on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'OpenAPI spec not found: api/openapi.yaml is missing'
  /docs/openapi.yaml:
    get:
      tags: [Docs]
      summary: Raw OpenAPI specification
      description: |
        Serves the canonical OpenAPI 3.0 spec (`api/openapi.yaml`) consumed by
        Swagger UI, client code generation, and contract tests. Only available
        in non-production environments.
      operationId: getOpenApiSpec
      responses:
        '200':
          description: The OpenAPI 3.0 YAML document.
          content:
            application/yaml:
              schema:
                type: string
              example: |
                openapi: 3.0.3
                info:
                  title: Vesting Cliff Drip Stream API
                  version: 1.0.0
        '404':
          description: Returned in production environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
        '500':
          description: The spec file exists but could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to read OpenAPI spec
        '503':
          description: The OpenAPI spec file is missing on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'OpenAPI spec not found: api/openapi.yaml is missing'
  /analytics/sponsor/{address}:
    get:
      tags: [Analytics]
      summary: Aggregate statistics for a sponsor
      description: |
        Aggregated stream statistics (active streams, locked and claimed
        totals, per-token breakdown) for the given sponsor address. Responses
        are cached in Redis for 60 seconds and carry a `Cache-Control`
        header.
      operationId: getSponsorAnalytics
      parameters:
        - $ref: '#/components/parameters/AddressParam'
      responses:
        '200':
          description: Aggregated sponsor statistics.
          headers:
            Cache-Control:
              description: Cache policy for the response body.
              schema:
                type: string
                example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SponsorAnalytics'
              example:
                sponsor: GSPONSORAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                totals:
                  active_streams: 2
                  total_locked: '28350000'
                  total_claimed: '5000000'
                by_token:
                  - token: CTOKENCONTRACTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    active_streams: '2'
                    total_locked: '28350000'
                    total_claimed: '5000000'
                cached: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/challenge:
    post:
      tags: [Auth]
      summary: Request an authentication challenge
      description: |
        Returns a nonce and the exact message string that the wallet must
        sign with its Ed25519 key. The nonce is single-use and expires after
        300 seconds.
      operationId: createAuthChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
            example:
              address: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '200':
          description: |
            Challenge issued. `message` is the exact string to sign; it
            concatenates the address, nonce, and `created_at` (epoch
            milliseconds) separated by colons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeResponse'
              example:
                nonce: 5f6e7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
                expires_in: 300
                created_at: 1699999999999
                message: 'GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA:5f6e7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b:1699999999999'
        '400':
          description: |
            The address is missing or is not a valid Stellar public key
            (must match `^G[A-Z2-7]{55}$`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: address must be a valid Stellar public key (G...)
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: The nonce cache (Redis) is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: cache unavailable
  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Exchange a signed challenge for JWTs
      description: |
        Verifies the Ed25519 signature over the challenge message and issues
        an RS256 access token (24 h) and an opaque refresh token (30 d). The
        nonce is consumed on use. Wallets in `ADMIN_ADDRESSES` receive the
        `admin` role.
      operationId: createAuthToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
            example:
              address: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              nonce: 5f6e7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
              timestamp: 1699999999999
              signature: Tk9URUFTRUVETk90aGVSZXF1aXJlZFNpZ25hdHVyZUZvckV4YW1wbGU=
      responses:
        '200':
          description: Token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjlmODZkMDgxODg0YzdkNjUiLCJ0eXAiOiJKV1QifQ.eyJzdWIiOiJHREVMSUdBVFVTQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBIiwicm9sZSI6InVzZXIifQ.PLACEBO
                refresh_token: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3
                token_type: Bearer
                expires_in: 86400
                role: user
        '400':
          description: |
            Invalid request — missing fields, non-numeric or out-of-window
            timestamp (±5 minutes), unknown/already-used nonce, nonce issued
            for a different address, or a non-base64 signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: nonce not found or already used
        '401':
          description: The signature does not verify against the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: signature verification failed
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an access token
      description: |
        Exchanges a valid refresh token for a new access token. Refresh
        tokens are not rotated by this call.
      operationId: refreshAuthToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
            example:
              refresh_token: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3
      responses:
        '200':
          description: New access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjlmODZkMDgxODg0YzdkNjUiLCJ0eXAiOiJKV1QifQ.eyJzdWIiOiJHREVMSUdBVFVTQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFIIiwicm9sZSI6InVzZXIifQ.PLACEBO
                token_type: Bearer
                expires_in: 86400
                role: user
        '400':
          description: The refresh token is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: refresh_token is required
        '401':
          description: The refresh token is unknown or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: refresh token not found or expired
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/schedules/{recipient}:
    get:
      tags: [Schedules]
      summary: Vesting schedule for a recipient
      description: |
        Full vesting schedule (sponsor, token, rate per ledger, ledger
        boundaries) plus the currently claimable amount. Read via Soroban RPC
        simulations of the contract's `get_schedule` and `claimable_amount`
        functions — no authentication required.
      operationId: getVestingSchedule
      parameters:
        - $ref: '#/components/parameters/RecipientParam'
      responses:
        '200':
          description: The vesting schedule and claimable balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
              example:
                recipient: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                sponsor: GSPONSORAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                token: CTOKENCONTRACTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                rate: '1000000'
                start_ledger: 51000000
                cliff_ledger: 51200000
                end_ledger: 51800000
                claimable_amount: '5000000'
                is_cliff_passed: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/claimable/{recipient}:
    get:
      tags: [Schedules]
      summary: Claimable balance for a recipient
      description: |
        The currently claimable amount for the recipient's stream, read via a
        Soroban RPC simulation of the contract's `claimable_amount` function.
      operationId: getClaimableBalance
      parameters:
        - $ref: '#/components/parameters/RecipientParam'
      responses:
        '200':
          description: The claimable balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
              example:
                recipient: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                claimable_amount: '5000000'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/schedules/sponsor/{sponsor}:
    get:
      tags: [Schedules]
      summary: Stream events created by a sponsor
      description: |
        Paginated `stream_created` contract events emitted by the given
        sponsor, read from the Horizon contract-events endpoint (newest
        first). Use the `cursor` parameter to walk pages with the
        `next_cursor` value from a previous response.
      operationId: listSponsorStreamEvents
      parameters:
        - $ref: '#/components/parameters/SponsorParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated stream events for the sponsor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamEventListResponse'
              example:
                items:
                  - recipient: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    sponsor: GSPONSORAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    token: AAAABgAAAADJhWd2hveXPoBMFBCQ5t5BpHkfFtR8F1o5XJDf0xP2s
                    ledger: 51000000
                    event_id: '00000051200000-0000000000'
                page: 1
                limit: 25
                next_cursor: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/admin/set_min_deposit:
    post:
      tags: [Admin]
      summary: Update the contract's minimum deposit
      description: |
        Submits a Soroban transaction calling `set_min_deposit` on the vesting
        contract. Requires an access token with the `admin` role; the action
        is audit-logged with the admin's wallet address.
      operationId: setMinDeposit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMinDepositRequest'
            example:
              min_deposit: '1000000'
      responses:
        '200':
          description: Transaction accepted for inclusion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetMinDepositResponse'
              example:
                ok: true
                min_deposit: '1000000'
                tx_hash: 3fd1a8c2a99e7ea3f5a2bbd9d1d31b6ea5d9d7a1b6ca0e0fd9d1c7a4a7b8c9d0
        '400':
          description: |
            The token is missing/not a non-negative integer string
            (`^\d+$`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: min_deposit must be a non-negative integer string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: |
            The Soroban RPC submission failed or the contract rejected the
            call. `detail` carries the raw error result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCallFailedError'
              example:
                error: contract call failed
                detail:
                  txHash: 3fd1a8c2a99e7ea3f5a2bbd9d1d31b6ea5d9d7a1b6ca0e0fd9d1c7a4a7b8c9d0
                  resultXdr: AAAAAAAAAAA=
  /api/v1/admin/pause_stream:
    post:
      tags: [Admin]
      summary: Pause a vesting stream
      description: |
        Submits a Soroban transaction pausing the stream for the given
        recipient. Requires an access token with the `admin` role; the action
        is audit-logged with the admin's wallet address.
      operationId: pauseStream
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseStreamRequest'
            example:
              recipient: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '200':
          description: Transaction accepted for inclusion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseStreamResponse'
              example:
                ok: true
                recipient: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                tx_hash: 3fd1a8c2a99e7ea3f5a2bbd9d1d31b6ea5d9d7a1b6ca0e0fd9d1c7a4a7b8c9d0
        '400':
          description: The recipient is missing or not a valid Stellar public key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: recipient must be a valid Stellar public key
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: The Soroban submission failed or the contract rejected the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCallFailedError'
              example:
                error: contract call failed
                detail:
                  txHash: 3fd1a8c2a99e7ea3f5a2bbd9d1d31b6ea5d9d7a1b6ca0e0fd9d1c7a4a7b8c9d0
                  resultXdr: AAAAAAAAAAA=
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT issued by `POST /api/v1/auth/token`. The JWT header carries
        a `kid` that maps to a key in `GET /.well-known/jwks.json`.
        `/api/v1/admin/*` endpoints additionally require the `admin` role.
  parameters:
    RecipientParam:
      name: recipient
      in: path
      required: true
      description: Stellar public key of the stream recipient (starts with `G`).
      schema:
        $ref: '#/components/schemas/StellarAddress'
      example: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    SponsorParam:
      name: sponsor
      in: path
      required: true
      description: Stellar public key of the stream sponsor (starts with `G`).
      schema:
        $ref: '#/components/schemas/StellarAddress'
      example: GSPONSORAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    AddressParam:
      name: address
      in: path
      required: true
      description: Stellar public key of the sponsor being queried (starts with `G`).
      schema:
        $ref: '#/components/schemas/StellarAddress'
      example: GSPONSORAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Horizon paging token for resuming a previous page.
      schema:
        type: string
      example: '00000051200000-0000000000'
  responses:
    ValidationError:
      description: |
        Request validation failed — path/query parameters do not match their
        schemas. `fields` lists every offending field with the validation
        message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error: validation_failed
            fields:
              - field: recipient
                message: must match /^G[A-Z2-7]{55}$/
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
    Forbidden:
      description: The token's role is insufficient for this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Forbidden: insufficient role'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: schedule not found
    TooManyRequests:
      description: |
        Rate limit exceeded. Sliding-window limits are applied per IP
        (Redis-backed); the headers report the window state.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
            example: 42
        X-RateLimit-Limit:
          description: Requests allowed in the current window.
          schema:
            type: integer
            example: 100
        X-RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          description: Epoch seconds when the window resets.
          schema:
            type: integer
            example: 1699999999
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            error: Too Many Requests
            retryAfter: 42
    InternalServerError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error
    BadGateway:
      description: An upstream dependency (Horizon, Soroban RPC) is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: horizon unavailable
  schemas:
    StellarAddress:
      type: string
      pattern: '^G[A-Z2-7]{55}$'
      description: Stellar account public key (strkey `G...`).
      example: GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ContractAddress:
      type: string
      pattern: '^C[A-Z2-7]{55}$'
      description: Stellar contract address (strkey `C...`).
      example: CTOKENCONTRACTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    Error:
      type: object
      description: Standard error envelope for all non-2xx JSON responses.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable or machine-readable error message.
          example: schedule not found
    ValidationError:
      type: object
      description: Request validation failure with per-field detail.
      required: [error, fields]
      properties:
        error:
          type: string
          enum: [validation_failed]
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Dotted path of the offending field.
                example: recipient
              message:
                type: string
                description: Validation error message.
                example: must match /^G[A-Z2-7]{55}$/
    RateLimitError:
      type: object
      description: Rate limit exceeded.
      required: [error, retryAfter]
      properties:
        error:
          type: string
          example: Too Many Requests
        retryAfter:
          type: integer
          description: Seconds until the client may retry.
          example: 42
    ContractCallFailedError:
      type: object
      description: Soroban contract submission failed or was rejected.
      required: [error, detail]
      properties:
        error:
          type: string
          example: contract call failed
        detail:
          type: object
          additionalProperties: true
          description: Raw Soroban error result (XDR decoded object).
    Stream:
      type: object
      description: |
        A vesting stream: the on-chain schedule for a recipient together with
        the currently claimable amount.
      required:
        - recipient
        - sponsor
        - token
        - rate
        - start_ledger
        - cliff_ledger
        - end_ledger
        - claimable_amount
        - is_cliff_passed
      properties:
        recipient:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Stream recipient.
        sponsor:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Account that created the stream.
        token:
          allOf:
            - $ref: '#/components/schemas/ContractAddress'
          description: Token contract in which the stream is denominated.
        rate:
          type: string
          description: Amount vested per ledger, as an i128 decimal string.
          example: '1000000'
        start_ledger:
          type: integer
          format: int64
          description: Ledger sequence at which vesting starts.
          example: 51000000
        cliff_ledger:
          type: integer
          format: int64
          description: Ledger sequence at which the cliff unlocks.
          example: 51200000
        end_ledger:
          type: integer
          format: int64
          description: Ledger sequence at which the stream ends.
          example: 51800000
        claimable_amount:
          type: string
          description: Currently claimable amount, as an i128 decimal string.
          example: '5000000'
        is_cliff_passed:
          type: boolean
          description: Whether the current ledger is at or past the cliff.
          example: true
    Balance:
      type: object
      description: Claimable balance for a recipient's stream.
      required: [recipient, claimable_amount]
      properties:
        recipient:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Stream recipient.
        claimable_amount:
          type: string
          description: Currently claimable amount, as an i128 decimal string.
          example: '5000000'
    StreamEvent:
      type: object
      description: |
        A `stream_created` contract event emitted on Horizon for a sponsor's
        stream.
      required: [recipient, sponsor, token, ledger, event_id]
      properties:
        recipient:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Stream recipient.
        sponsor:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Sponsor that emitted the event.
        token:
          type: string
          description: Token contract address as a base64 XDR `ScVal` string.
          example: AAAABgAAAADJhWd2hveXPoBMFBCQ5t5BpHkfFtR8F1o5XJDf0xP2s
        ledger:
          type: integer
          format: int64
          description: Ledger sequence in which the event was emitted.
          example: 51000000
        event_id:
          type: string
          description: Horizon event id (paging token).
          example: '00000051200000-0000000000'
    StreamEventListResponse:
      type: object
      description: Paginated list of stream events for a sponsor.
      required: [items, page, limit, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StreamEvent'
        page:
          type: integer
          description: Current 1-based page number.
          example: 1
        limit:
          type: integer
          description: Page size used for the query.
          example: 25
        next_cursor:
          type: string
          nullable: true
          description: Horizon paging token for the next page, or `null` when exhausted.
          example: null
    HealthResponse:
      type: object
      description: Liveness response with dependency check results.
      required:
        - status
        - version
        - uptime
        - uptime_seconds
        - contract_version
        - checks
        - horizon_circuit
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Backend service version.
          example: 1.0.0
        uptime:
          type: integer
          description: Process uptime in seconds.
          example: 120
        uptime_seconds:
          type: integer
          description: Process uptime in seconds (alias of `uptime`).
          example: 120
        contract_version:
          type: string
          description: Deployed contract version, or `unknown` before the startup check completes.
          example: 1.2.0
        checks:
          type: object
          required: [db, rpc, redis]
          properties:
            db:
              $ref: '#/components/schemas/DependencyCheckStatus'
            rpc:
              $ref: '#/components/schemas/DependencyCheckStatus'
            redis:
              $ref: '#/components/schemas/DependencyCheckStatus'
        horizon_circuit:
          type: string
          enum: [closed, open, half-open]
          description: Horizon circuit-breaker state.
    ReadyResponse:
      description: Readiness response — health checks plus indexer freshness.
      allOf:
        - $ref: '#/components/schemas/HealthResponse'
        - type: object
          properties:
            checks:
              type: object
              required: [db, rpc, redis, indexer]
              properties:
                db:
                  $ref: '#/components/schemas/DependencyCheckStatus'
                rpc:
                  $ref: '#/components/schemas/DependencyCheckStatus'
                redis:
                  $ref: '#/components/schemas/DependencyCheckStatus'
                indexer:
                  type: string
                  enum: [ok, 'timeout or unavailable', 'lag > 60s']
                  description: Indexer freshness check.
    DependencyCheckStatus:
      type: string
      enum: [ok, 'timeout or unavailable']
      description: Result of a single dependency health check.
    JwksResponse:
      type: object
      description: JSON Web Key Set of the backend's RSA signing keys.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      description: A single RSA public signing key.
      required: [kty, kid, use, alg, n, e]
      properties:
        kty:
          type: string
          enum: [RSA]
        kid:
          type: string
          description: Key id matching the JWT header `kid` claim.
          example: 9f86d081884c7d65
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [RS256]
        n:
          type: string
          description: RSA modulus, base64url encoded.
        e:
          type: string
          description: RSA exponent, base64url encoded.
          example: AQAB
    SponsorAnalytics:
      type: object
      description: Aggregated stream statistics for a sponsor.
      required: [sponsor, totals, by_token, cached]
      properties:
        sponsor:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Sponsor the statistics were aggregated for.
        totals:
          type: object
          required: [active_streams, total_locked, total_claimed]
          properties:
            active_streams:
              type: integer
              description: Number of active streams across all tokens.
              example: 2
            total_locked:
              type: string
              description: Total locked amount across all tokens, as a decimal string.
              example: '28350000'
            total_claimed:
              type: string
              description: Total claimed amount across all tokens, as a decimal string.
              example: '5000000'
        by_token:
          type: array
          description: Per-token breakdown of the same statistics.
          items:
            type: object
            required: [token, active_streams, total_locked, total_claimed]
            properties:
              token:
                $ref: '#/components/schemas/ContractAddress'
              active_streams:
                type: string
                description: Number of active streams for this token (string, as returned by the aggregate query).
                example: '2'
              total_locked:
                type: string
                description: Total locked amount for this token, as a decimal string.
                example: '28350000'
              total_claimed:
                type: string
                description: Total claimed amount for this token, as a decimal string.
                example: '5000000'
        cached:
          type: boolean
          description: Whether the response was served from the Redis cache.
          example: false
    AuthChallengeRequest:
      type: object
      description: Wallet challenge request.
      required: [address]
      properties:
        address:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Stellar public key of the wallet requesting the challenge.
    AuthChallengeResponse:
      type: object
      description: Challenge nonce and the message to sign.
      required: [nonce, expires_in, created_at, message]
      properties:
        nonce:
          type: string
          format: uuid
          description: Single-use nonce (UUID v4).
        expires_in:
          type: integer
          description: Challenge validity in seconds.
          example: 300
        created_at:
          type: integer
          description: Challenge creation time, epoch milliseconds.
          example: 1699999999999
        message:
          type: string
          description: |
            Exact string to be Ed25519-signed by the wallet —
            `<address>:<nonce>:<created_at>`.
          example: 'GDELIGATUSAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA:5f6e7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b:1699999999999'
    AuthTokenRequest:
      type: object
      description: Signed-challenge token request.
      required: [address, nonce, timestamp, signature]
      properties:
        address:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Stellar public key that signed the challenge.
        nonce:
          type: string
          format: uuid
          description: Nonce obtained from the challenge endpoint.
        timestamp:
          type: integer
          description: Signature timestamp, epoch milliseconds (±5 minutes window).
          example: 1699999999999
        signature:
          type: string
          description: Base64 Ed25519 signature over `<address>:<nonce>:<timestamp>`.
          example: Tk9URUFTRUVETk90aGVSZXF1aXJlZFNpZ25hdHVyZUZvckV4YW1wbGU=
    AuthTokenResponse:
      type: object
      description: Issued token pair.
      required: [access_token, refresh_token, token_type, expires_in, role]
      properties:
        access_token:
          type: string
          description: 'RS256 JWT; use as `Authorization: Bearer <token>`.'
        refresh_token:
          type: string
          description: Opaque refresh token (80-char hex), valid for 30 days.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 86400
        role:
          type: string
          enum: [user, admin]
          description: Role granted to the wallet.
    AuthRefreshRequest:
      type: object
      description: Refresh token request.
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token obtained from the token endpoint.
    AuthRefreshResponse:
      type: object
      description: Refreshed access token.
      required: [access_token, token_type, expires_in, role]
      properties:
        access_token:
          type: string
          description: New RS256 JWT.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 86400
        role:
          type: string
          enum: [user, admin]
          description: Role granted to the wallet.
    SetMinDepositRequest:
      type: object
      description: Minimum deposit update request.
      required: [min_deposit]
      properties:
        min_deposit:
          type: string
          pattern: '^\d+$'
          description: New minimum deposit, as a non-negative i128 decimal string.
          example: '1000000'
    SetMinDepositResponse:
      type: object
      description: Minimum deposit update result.
      required: [ok, min_deposit, tx_hash]
      properties:
        ok:
          type: boolean
          example: true
        min_deposit:
          type: string
          description: The applied minimum deposit.
          example: '1000000'
        tx_hash:
          type: string
          description: Hash of the submitted Soroban transaction.
          example: 3fd1a8c2a99e7ea3f5a2bbd9d1d31b6ea5d9d7a1b6ca0e0fd9d1c7a4a7b8c9d0
    PauseStreamRequest:
      type: object
      description: Stream pause request.
      required: [recipient]
      properties:
        recipient:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Recipient whose stream should be paused.
    PauseStreamResponse:
      type: object
      description: Stream pause result.
      required: [ok, recipient, tx_hash]
      properties:
        ok:
          type: boolean
          example: true
        recipient:
          allOf:
            - $ref: '#/components/schemas/StellarAddress'
          description: Recipient whose stream was paused.
        tx_hash:
          type: string
          description: Hash of the submitted Soroban transaction.
          example: 3fd1a8c2a99e7ea3f5a2bbd9d1d31b6ea5d9d7a1b6ca0e0fd9d1c7a4a7b8c9d0
